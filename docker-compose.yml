# ==============================================================================
# Monorepo Restaurante Inteligente - Infraestrutura Local
# PostgreSQL 16 (RLS + WAL), Redis 7 (Cache/Locks/SSE) e RabbitMQ 3 (AMQP Raw JSON)
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurante_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurante_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_seguro_123}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_WALDIR: /var/lib/postgresql/wal
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8"
    command: >
      postgres
      -c shared_buffers=768MB
      -c effective_cache_size=2304MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track_utility=off
      -c pg_stat_statements.save=on
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /var/lib/postgresql/backups/wal_archive/%f && cp %p /var/lib/postgresql/backups/wal_archive/%f'
      -c archive_timeout=900
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-wal:/var/lib/postgresql/wal
      - postgres-backup:/var/lib/postgresql/backups
      - ./src/RestauranteInteligente.Infrastructure/Persistence/Scripts/01_init_schema_rls.sql:/docker-entrypoint-initdb.d/01_init_schema_rls.sql:ro
      - ./src/RestauranteInteligente.Infrastructure/Persistence/Scripts/02_seed_initial_data.sql:/docker-entrypoint-initdb.d/02_seed_initial_data.sql:ro
    shm_size: 512m
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurante_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_backend_net

  redis:
    image: redis:7-alpine
    container_name: restaurante_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_seguro_123}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_seguro_123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_backend_net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: restaurante_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_backend_net

  webapi:
    build:
      context: .
      dockerfile: src/RestauranteInteligente.Api/Dockerfile
    container_name: restaurante_webapi
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-restaurante_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_seguro_123}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_seguro_123}
      REDIS_DB: ${REDIS_DB:-0}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_KEY: ${JWT_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-RestauranteInteligente}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-RestauranteInteligente.App}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-15}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal_backend_net

  ml-worker:
    build:
      context: ./ml/RestauranteInteligente.ML
      dockerfile: Dockerfile
    container_name: restaurante_ml_worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_seguro_123}
      REDIS_DB: ${REDIS_DB:-0}
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_backend_net

volumes:
  postgres-data:
    driver: local
  postgres-wal:
    driver: local
  postgres-backup:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local

networks:
  internal_backend_net:
    driver: bridge
