# ==============================================================================
# Monorepo Restaurante Inteligente - Infraestrutura Local
# PostgreSQL 16 (RLS + WAL), Redis 7 (Cache/Locks/SSE) e RabbitMQ 3 (AMQP Raw JSON)
# ==============================================================================

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurante_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurante_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_seguro_123}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_WALDIR: /var/lib/postgresql/wal
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8"
    command: >
      postgres
      -c shared_buffers=768MB
      -c effective_cache_size=2304MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track_utility=off
      -c pg_stat_statements.save=on
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /var/lib/postgresql/backups/wal_archive/%f && cp %p /var/lib/postgresql/backups/wal_archive/%f'
      -c archive_timeout=900
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-wal:/var/lib/postgresql/wal
      - postgres-backup:/var/lib/postgresql/backups
    shm_size: 512m
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal_backend_net

  redis:
    image: redis:7-alpine
    container_name: restaurante_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_seguro_123}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_seguro_123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_backend_net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: restaurante_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    networks:
      - internal_backend_net

volumes:
  postgres-data:
    driver: local
  postgres-wal:
    driver: local
  postgres-backup:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local

networks:
  internal_backend_net:
    driver: bridge
