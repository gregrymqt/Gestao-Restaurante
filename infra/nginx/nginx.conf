# ==============================================================================
# Nginx Master Configuration - Restaurante Inteligente
# Gateway Unificado, Reverse Proxy & Servidor SPA
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Formato de log estruturado incluindo métricas de upstream e tempo de requisição
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main_ext;

    # Otimizações de I/O de rede
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Limite de payload alinhado à aplicação (importação de cardápio / uploads)
    client_max_body_size 10M;

    # Compressão Gzip para assets estáticos e payloads JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Headers universais de segurança (Defesa em Profundidade)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Inclusão dos blocos de servidores virtuais
    include /etc/nginx/conf.d/*.conf;
}
