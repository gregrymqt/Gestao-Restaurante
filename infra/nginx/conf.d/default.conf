# ==============================================================================
# Virtual Host Configuration - Gateway Unificado
# Roteamento: Frontend Expo Web (/), API .NET (/api/), SSE (/sse) e ML (/ml/)
# ==============================================================================

upstream backend_api {
    server webapi:5000;
    keepalive 32;
}

upstream ml_worker {
    server ml-worker:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # --------------------------------------------------------------------------
    # 1. Frontend SPA & PWA (Expo Web / React Native)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Service Worker e Manifesto NUNCA recebem cache imutável de 1 ano
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Cache imutável para assets estáticos gerados com hash pelo bundler
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 2. Backend ASP.NET Core API (.NET 9)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Documentação interativa Swagger
    location /swagger {
        proxy_pass http://backend_api/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 3. Server-Sent Events (SSE) - Alertas Críticos de Estoque em Tempo Real
    # --------------------------------------------------------------------------
    location /api/v1/events/sse {
        proxy_pass http://backend_api/api/v1/events/sse;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Desativação obrigatória de buffer para streaming reativo instantâneo
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Timeout expandido para manter a conexão aberta sem interrupção do proxy
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # 4. Worker de Machine Learning (Python FastAPI)
    # --------------------------------------------------------------------------
    location /ml/ {
        rewrite ^/ml/(.*)$ /$1 break;
        proxy_pass http://ml_worker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 5. Segurança: Bloqueio de arquivos ocultos e sensíveis
    # --------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
