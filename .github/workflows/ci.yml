name: CI/CD Pipeline - Restaurante Inteligente

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. PostgreSQL 16 Native Layer (Schema, RLS Forçado & Testes Discriminatórios)
  # ============================================================================
  sql-ci:
    name: PostgreSQL 16 (Schema, RLS & 6 Discriminatory Tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restaurante_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_seguro_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Aguardando inicialização do PostgreSQL 16..."
            sleep 1
          done
          echo "PostgreSQL 16 operacional."

      - name: Apply Database Schema & Native RLS (01_init_schema_rls.sql)
        env:
          PGPASSWORD: postgres_seguro_123
        run: >
          psql -h localhost -p 5432 -U postgres -d restaurante_db
          -f src/RestauranteInteligente.Infrastructure/Persistence/Scripts/01_init_schema_rls.sql

      - name: Apply Initial Seed Data (02_seed_initial_data.sql)
        env:
          PGPASSWORD: postgres_seguro_123
        run: >
          psql -h localhost -p 5432 -U postgres -d restaurante_db
          -f src/RestauranteInteligente.Infrastructure/Persistence/Scripts/02_seed_initial_data.sql

      - name: Setup Application Non-Superuser Role (setup_app_role.sql)
        env:
          PGPASSWORD: postgres_seguro_123
        run: >
          psql -h localhost -p 5432 -U postgres -d restaurante_db
          -f tests/setup_app_role.sql

      - name: Execute RLS Discriminatory Test Suite (rls_discriminatory_tests.sql)
        env:
          PGPASSWORD: postgres_seguro_123
        run: >
          psql -h localhost -p 5432 -U postgres -d restaurante_db
          -f tests/rls_discriminatory_tests.sql

  # ============================================================================
  # 2. Backend Validation (.NET 9 / Clean Architecture / DDD)
  # ============================================================================
  backend-ci:
    name: Backend .NET 9 (Build & 192 Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'RestauranteInteligente.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore RestauranteInteligente.sln

      - name: Build Solution (Release)
        run: dotnet build RestauranteInteligente.sln -c Release --no-restore

      - name: Run Backend Unit Tests (xUnit)
        run: >
          dotnet test RestauranteInteligente.sln
          -c Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=backend-test-results.trx"

      - name: Upload Backend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'
          retention-days: 7

  # ============================================================================
  # 3. Worker ML Validation (Python 3.12 / Zero-SQL / Pytest)
  # ============================================================================
  ml-worker-ci:
    name: Worker ML Python 3.12 (Zero-SQL & 19 Pytests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml/RestauranteInteligente.ML/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/RestauranteInteligente.ML/requirements.txt

      - name: Enforce Zero-SQL Invariant (Cláusula Inegociável 1)
        run: |
          echo "=========================================================="
          echo "Auditando Cláusula 1: Segregação Absoluta do Worker Python"
          echo "=========================================================="
          FORBIDDEN_IMPORTS=$(grep -rnE "(import psycopg2|import asyncpg|import sqlalchemy|from sqlalchemy|import sqlite3)" ml/RestauranteInteligente.ML/app/ || true)
          if [ -n "$FORBIDDEN_IMPORTS" ]; then
            echo "::error::Violação arquitetural detectada! O Worker Python não pode importar drivers relacionais:"
            echo "$FORBIDDEN_IMPORTS"
            exit 1
          fi
          echo "Invariant respeitado: Zero drivers relacionais no Worker Python."

      - name: Run ML Unit Tests (pytest)
        run: pytest ml/RestauranteInteligente.ML/tests/ -v

  # ============================================================================
  # 4. Frontend Mobile Validation (React Native / TypeScript / Expo)
  # ============================================================================
  frontend-ci:
    name: Frontend React Native (TypeScript & 6 Test Suites)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Run Frontend Unit Tests
        env:
          EXPO_PUBLIC_API_URL: http://localhost:5000/api/v1
          EXPO_PUBLIC_API_ID: restaurante-inteligente-pdv
        run: npx --yes tsx --test __tests__/*.test.ts

  # ============================================================================
  # 5. Container Build Validation (Docker Multi-Stage)
  # ============================================================================
  docker-validation:
    name: Docker Build Validation (WebApi, ML-Worker & Gateway)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build WebApi Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/RestauranteInteligente.Api/Dockerfile
          push: false
          tags: restaurante-webapi:ci-test

      - name: Build ML Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ml/RestauranteInteligente.ML
          file: ./ml/RestauranteInteligente.ML/Dockerfile
          push: false
          tags: restaurante-ml-worker:ci-test

      - name: Build Frontend Nginx Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/nginx/Dockerfile
          push: false
          tags: restaurante-frontend-gateway:ci-test

  # ============================================================================
  # 6. Quality Gate (Mandatory Status Check for Main Branch Protection)
  # ============================================================================
  quality-gate:
    name: Quality Gate - All Checks Passed
    runs-on: ubuntu-latest
    needs: [sql-ci, backend-ci, ml-worker-ci, frontend-ci, docker-validation]
    steps:
      - name: Summarize CI Verification
        run: |
          echo "=========================================================="
          echo "   QUALITY GATE APROVADO: 100% DOS TESTES E BUILDS VERDES  "
          echo "=========================================================="
          echo " - Banco PostgreSQL 16: Schema DDL, RLS nativo e 6 testes discriminatórios"
          echo " - Backend .NET 9: 192 testes unitários validados (xUnit)"
          echo " - Worker ML Python 3.12: 19 testes e Cláusula Zero-SQL validados"
          echo " - Frontend React Native: Tipagem estrita TypeScript e 6 suítes validadas"
          echo " - Docker Containers: WebApi, ML-Worker e Nginx Gateway compilados com êxito"
          echo "=========================================================="
          echo "O repositório atende a todos os critérios de aceitação para a branch main."

  # ============================================================================
  # 7. Continuous Deployment (CD) - Publish Containers to GHCR (Main Only)
  # ============================================================================
  cd-deploy:
    name: Continuous Deployment (GHCR)
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (WebApi)
        id: meta-webapi
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/webapi
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push WebApi Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/RestauranteInteligente.Api/Dockerfile
          push: true
          tags: ${{ steps.meta-webapi.outputs.tags }}
          labels: ${{ steps.meta-webapi.outputs.labels }}

      - name: Extract Metadata (ML Worker)
        id: meta-ml
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ml-worker
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push ML Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ml/RestauranteInteligente.ML
          file: ./ml/RestauranteInteligente.ML/Dockerfile
          push: true
          tags: ${{ steps.meta-ml.outputs.tags }}
          labels: ${{ steps.meta-ml.outputs.labels }}
