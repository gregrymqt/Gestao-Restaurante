name: CI/CD Pipeline - Restaurante Inteligente

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================================
  # 1. PostgreSQL 16 Native Layer (Schema, RLS Forçado & Testes Discriminatórios)
  # ============================================================================
  sql-ci:
    name: PostgreSQL 16 (Schema, RLS & 6 Discriminatory Tests)
    runs-on: ubuntu-latest
    env:
      PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restaurante_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Aguardando inicialização do PostgreSQL 16..."
            sleep 1
          done
          echo "PostgreSQL 16 operacional."

      - name: Apply Database Schema & Native RLS (01_init_schema_rls.sql)
        run: >
          psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U postgres -d restaurante_db
          -f src/RestauranteInteligente.Infrastructure/Persistence/Scripts/01_init_schema_rls.sql

      - name: Apply Initial Seed Data (02_seed_initial_data.sql)
        run: >
          psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U postgres -d restaurante_db
          -f src/RestauranteInteligente.Infrastructure/Persistence/Scripts/02_seed_initial_data.sql

      - name: Setup Application Non-Superuser Role (setup_app_role.sql)
        run: >
          psql -h localhost -p 5432 -U postgres -d restaurante_db
          -f tests/setup_app_role.sql

      - name: Apply and replay modifiers schema upgrade
        run: >
          psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U postgres -d restaurante_db
          -f scripts/sql/03_modificadores_schema.sql
          -f scripts/sql/03_modificadores_schema.sql

      - name: Execute RLS Discriminatory Test Suite (rls_discriminatory_tests.sql)
        run: >
          psql -h localhost -p 5432 -U postgres -d restaurante_db
          -f tests/rls_discriminatory_tests.sql

  # ============================================================================
  # 2. Backend Validation (.NET 9 / Clean Architecture / DDD)
  # ============================================================================
  backend-ci:
    name: Backend .NET 9 (Build & 192 Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment File (.env)
        run: cp .env.example .env

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'RestauranteInteligente.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore RestauranteInteligente.sln

      - name: Build Solution (Release)
        run: dotnet build RestauranteInteligente.sln -c Release --no-restore

      - name: Run Backend Unit Tests (xUnit)
        run: >
          dotnet test RestauranteInteligente.sln
          -c Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=backend-test-results.trx"

      - name: Upload Backend Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'
          retention-days: 7

  # ============================================================================
  # 3. Worker ML Validation (Python 3.12 / Zero-SQL / Pytest)
  # ============================================================================
  ml-worker-ci:
    name: Worker ML Python 3.12 (Zero-SQL & 19 Pytests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml/RestauranteInteligente.ML/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/RestauranteInteligente.ML/requirements.txt

      - name: Enforce Zero-SQL Invariant (Cláusula Inegociável 1)
        run: |
          echo "=========================================================="
          echo "Auditando Cláusula 1: Segregação Absoluta do Worker Python"
          echo "=========================================================="
          FORBIDDEN_IMPORTS=$(grep -rnE "(import psycopg2|import asyncpg|import sqlalchemy|from sqlalchemy|import sqlite3)" ml/RestauranteInteligente.ML/app/ || true)
          if [ -n "$FORBIDDEN_IMPORTS" ]; then
            echo "::error::Violação arquitetural detectada! O Worker Python não pode importar drivers relacionais:"
            echo "$FORBIDDEN_IMPORTS"
            exit 1
          fi
          echo "Invariant respeitado: Zero drivers relacionais no Worker Python."

      - name: Run ML Unit Tests (pytest)
        run: pytest ml/RestauranteInteligente.ML/tests/ -v

  # ============================================================================
  # 4. Frontend Mobile Validation (React Native / TypeScript / Expo)
  # ============================================================================
  frontend-ci:
    name: Frontend React Native (TypeScript & 6 Test Suites)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Run Frontend Unit Tests
        env:
          EXPO_PUBLIC_API_URL: http://localhost:5000/api/v1
          EXPO_PUBLIC_API_ID: restaurante-inteligente-pdv
        run: npx --yes tsx --test __tests__/*.test.ts

  # ============================================================================
  # 5. Container Build Validation (Docker Multi-Stage)
  # ============================================================================
  docker-validation:
    name: Docker Build Validation (WebApi, ML-Worker & Gateway)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Validate production deployment files
        run: |
          bash -n infra/scripts/deploy-production.sh
          bash -n infra/scripts/azure-vm.sh
          docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet

      - name: Validate Azure PowerShell scripts
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = $env:RUNNER_TEMP
          foreach ($file in Get-ChildItem infra/scripts -Filter '*.ps1') {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { throw ($errors -join "`n") }
          }
          try {
            ./infra/scripts/destruir-azure.ps1 -Grupo NetworkWatcherRG -SomentePreview
            throw 'The destroy script accepted an unrelated resource group.'
          } catch {
            if ($_.Exception.Message -notlike 'Grupo fora do escopo*') { throw }
          }

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Validate Azure Terraform configuration
        run: |
          terraform -chdir=infra/terraform fmt -check
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build WebApi Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RestauranteInteligente.Api/Dockerfile
          push: false
          tags: restaurante-webapi:ci-test

      - name: Build ML Worker Image
        uses: docker/build-push-action@v6
        with:
          context: ./ml/RestauranteInteligente.ML
          file: ./ml/RestauranteInteligente.ML/Dockerfile
          push: false
          tags: restaurante-ml-worker:ci-test

      - name: Build Frontend Nginx Gateway Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/nginx/Dockerfile
          push: false
          tags: restaurante-frontend-gateway:ci-test

  # ============================================================================
  # 6. Quality Gate (Mandatory Status Check for Main Branch Protection)
  # ============================================================================
  quality-gate:
    name: Quality Gate - All Checks Passed
    runs-on: ubuntu-latest
    needs: [sql-ci, backend-ci, ml-worker-ci, frontend-ci, docker-validation]
    steps:
      - name: Summarize CI Verification
        run: |
          echo "=========================================================="
          echo "   QUALITY GATE APROVADO: 100% DOS TESTES E BUILDS VERDES  "
          echo "=========================================================="
          echo " - Banco PostgreSQL 16: Schema DDL, RLS nativo e 6 testes discriminatórios"
          echo " - Backend .NET 9: 192 testes unitários validados (xUnit)"
          echo " - Worker ML Python 3.12: 19 testes e Cláusula Zero-SQL validados"
          echo " - Frontend React Native: Tipagem estrita TypeScript e 6 suítes validadas"
          echo " - Docker Containers: WebApi, ML-Worker e Nginx Gateway compilados com êxito"
          echo "=========================================================="
          echo "O repositório atende a todos os critérios de aceitação para a branch main."

  # ============================================================================
  # 7. Continuous Deployment (CD) - Publish Containers to GHCR (Main Only)
  # ============================================================================
  cd-deploy:
    name: Continuous Deployment (GHCR)
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (WebApi)
        id: meta-webapi
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/webapi
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=${{ github.sha }}

      - name: Build & Push WebApi Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RestauranteInteligente.Api/Dockerfile
          push: true
          tags: ${{ steps.meta-webapi.outputs.tags }}
          labels: ${{ steps.meta-webapi.outputs.labels }}

      - name: Extract Metadata (ML Worker)
        id: meta-ml
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/ml-worker
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=${{ github.sha }}

      - name: Build & Push ML Worker Image
        uses: docker/build-push-action@v6
        with:
          context: ./ml/RestauranteInteligente.ML
          file: ./ml/RestauranteInteligente.ML/Dockerfile
          push: true
          tags: ${{ steps.meta-ml.outputs.tags }}
          labels: ${{ steps.meta-ml.outputs.labels }}

  production:
    name: Deploy PostgreSQL, API and Worker
    if: github.ref == 'refs/heads/main' && vars.PROD_DEPLOY_ENABLED == 'true'
    needs: cd-deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Deploy exact commit over SSH
        env:
          DEPLOY_HOST: ${{ secrets.PROD_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.PROD_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Configure PROD_SSH_HOST}"
          : "${DEPLOY_USER:?Configure PROD_SSH_USER}"
          : "${DEPLOY_KEY:?Configure PROD_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Configure PROD_SSH_KNOWN_HOSTS}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          printf '%s\n' "$GHCR_TOKEN" > "$ssh_dir/registry-token"
          tar -cf - -C "$ssh_dir" registry-token -C "$GITHUB_WORKSPACE" \
            docker-compose.prod.yml infra/scripts/deploy-production.sh scripts/sql/03_modificadores_schema.sql |
            ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -o UserKnownHostsFile="$ssh_dir/known_hosts" -i "$ssh_dir/key" \
              -l "$DEPLOY_USER" -- "$DEPLOY_HOST" \
              "cd /opt/restaurante-inteligente &&
               flock -w 300 .production-deploy.lock bash -ec '
                 release=\$(mktemp -d)
                 trap \"rm -rf \\\"\$release\\\"\" EXIT
                 tar -xf - -C \"\$release\"
                 bash \"\$release/infra/scripts/deploy-production.sh\" \"\$release\" $GITHUB_SHA ${GITHUB_REPOSITORY,,} $GITHUB_ACTOR < \"\$release/registry-token\"
               '"
